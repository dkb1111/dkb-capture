<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><link rel="manifest" href="manifest.webmanifest"><title>DKB Capture</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f4;color:#111;font-family:Arial}.shell{max-width:760px;margin:auto;padding:16px;min-height:100vh}h1{margin:4px 0 14px}.tabs{display:flex;gap:8px}.tab{flex:1;min-height:54px;border:0;border-radius:13px;font-size:18px;font-weight:800}.tab.active{background:#111;color:#fff}.panel{display:none}.panel.on{display:block}#recordBtn{width:100%;min-height:170px;margin-top:14px;border:0;border-radius:24px;background:#111;color:#fff;font-size:34px;font-weight:900}#recordBtn.rec{background:#c9151b}.card,.note{background:#fff;border-radius:15px;padding:14px;margin-top:12px}.meter{height:25px;border-radius:13px;background:#ddd;overflow:hidden;margin:9px 0}#meterFill{height:100%;width:0;background:#222}#quality{font-size:30px;font-weight:900}.pill{display:inline-block;padding:7px 11px;border-radius:999px;background:#eee;font-weight:800;margin-top:8px}.hidden{display:none!important}.btn{min-height:50px;border:0;border-radius:11px;font-size:16px;font-weight:800;padding:10px 14px}.row{display:flex;gap:8px;margin-top:10px}.row .btn{flex:1}.primary{background:#111;color:#fff}.danger{background:#8f1010;color:#fff}.noteTop{display:flex;gap:11px;align-items:flex-start}.noteCheck{width:34px;height:34px;min-width:34px;margin-top:2px}.noteBody{flex:1}.noteMeta{font-weight:800;font-size:16px}.noteText{font-size:18px;line-height:1.35;margin-top:7px;white-space:pre-wrap}.noteActions{display:flex;justify-content:flex-end;margin-top:10px}.noteActions .btn{min-width:120px}.note.just-opened{background:#dff3df}#deleteBar{position:sticky;top:0;z-index:5;background:#f4f4f4;padding:7px 0}#deleteBarInner{background:#fff;border-radius:14px;padding:10px}.openTitle{font-size:20px;font-weight:900}.openText{font-size:19px;line-height:1.4;white-space:pre-wrap;margin-top:10px}audio{width:100%;margin-top:12px}.noAudio{margin-top:12px;font-weight:700;color:#555}.savingOverlay{position:fixed;inset:0;background:#a9a9a9;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}.savingBox{width:min(520px,100%);text-align:center}.savingText{font-size:31px;font-weight:900;margin-bottom:22px}#savingExit{width:100%;min-height:70px;background:#555;color:#fff;border:0;border-radius:16px;font-size:23px;font-weight:900}.small{font-size:13px;color:#555}
</style></head><body><div class="shell"><h1>DKB Capture</h1><div class="tabs"><button id="captureTab" class="tab active">CAPTURE</button><button id="notesTab" class="tab">NOTES</button></div>
<section id="capturePanel" class="panel on"><button id="recordBtn">● RECORD</button><div class="card"><b>Timer:</b> <span id="timer">00:00</span><div class="meter"><div id="meterFill"></div></div><div>Voice quality</div><div id="quality">READY</div><div class="small">Tap Record and speak normally.</div><div id="status" class="pill">READY</div></div><details class="card"><summary><b>Settings</b></summary><label>Capture Backend URL</label><input id="backendUrl" style="width:100%;padding:10px;margin-top:8px"><label>TV1 Bridge URL</label><input id="tv1BridgeUrl" style="width:100%;padding:10px;margin-top:8px"><div class="row"><button id="saveSettings" class="btn">SAVE SETTINGS</button></div></details></section>
<section id="notesPanel" class="panel"><div id="deleteBar" class="hidden"><div id="deleteBarInner"><b><span id="selectedCount">0</span> marked</b><div class="row"><button id="deleteMarked" class="btn danger">DELETE MARKED</button><button id="clearMarked" class="btn">CLEAR</button></div></div></div><div id="notesList"></div></section>
<section id="openPanel" class="panel"><div class="card"><div id="openMeta" class="openTitle">Voice note saved.</div><div id="openText" class="openText"></div><audio id="openAudio" controls preload="metadata" class="hidden"></audio><div id="openNoAudio" class="noAudio hidden">Audio unavailable.</div><div class="row"><button id="audioStop" class="btn">■ STOP AUDIO</button><button id="backToNotes" class="btn primary">← BACK TO NOTES</button></div><div class="row"><button id="addToNote" class="btn">● ADD TO NOTE</button></div></div></section></div>
<div id="savingOverlay" class="savingOverlay hidden"><div class="savingBox"><div class="savingText">SAVING…</div><button id="savingExit">EXIT</button></div></div><iframe id="syncFrame" name="syncFrame" class="hidden"></iframe><form id="syncForm" method="POST" target="syncFrame" class="hidden"><input type="hidden" id="payloadField" name="payload"></form><script src="app.js"></script></body></html>
